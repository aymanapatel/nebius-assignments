name: nebius-ddp-training

workdir: .

resources:
  infra: k8s/nebius-mk8s-ayman-e00qxayqbejprx5138  # Exact context from `kubectl config current-context` or `sky check kubernetes`.
  accelerators: "H100:1"  # Change if your node group uses another GPU type, e.g. "L40S:1".
  memory: "60+"
  image_id: docker:cr.eu-north1.nebius.cloud/e00ksrjdes2qw2ydsh/nebius-trainer:v1 # Change to the exact pushed image path/tag; use registry short ID.

num_nodes: 2

envs:
  MODEL_ID: "facebook/opt-1.3b"  # Change to a smaller model for faster tests, e.g. "facebook/opt-1.3b".
  TRAIN_SCRIPT: "train.py"
  BLOCK_SIZE: "512"  # Lower if GPU memory is tight.
  PER_DEVICE_TRAIN_BATCH_SIZE: "4"  # Lower if you hit CUDA OOM; raise if memory allows.
  PER_DEVICE_EVAL_BATCH_SIZE: "4"  # Usually keep same as train batch size or lower.
  GRADIENT_ACCUMULATION_STEPS: "1"  # Raise if you lower batch size but want similar effective batch size.
  DATALOADER_NUM_WORKERS: "8"  # Lower if CPU/RAM is limited or dataloader workers hang.
  TOKENIZERS_PARALLELISM: "false"
  NCCL_DEBUG: INFO  # Keep for submission; required to show NCCL initialization logs.
  NCCL_DEBUG_SUBSYS: INIT,NET  # Keep for submission; prints NCCL init/network details.

setup: |
  echo "Setup complete"
  nvidia-smi || true

run: |
  set -euxo pipefail

  MASTER_ADDR=$(echo "$SKYPILOT_NODE_IPS" | head -n 1)  # Usually keep; first SkyPilot node acts as torchrun master.
  MASTER_PORT=29500  # Change only if this port conflicts.

  echo "SKYPILOT_NODE_RANK=${SKYPILOT_NODE_RANK}"
  echo "SKYPILOT_NUM_NODES=${SKYPILOT_NUM_NODES}"
  echo "SKYPILOT_NUM_GPUS_PER_NODE=${SKYPILOT_NUM_GPUS_PER_NODE}"
  echo "SKYPILOT_NODE_IPS:"
  echo "$SKYPILOT_NODE_IPS"
  echo "MASTER_ADDR=${MASTER_ADDR}"
  echo "PWD=$(pwd)"
  test -f "${TRAIN_SCRIPT}"

  torchrun \
    --nproc_per_node=${SKYPILOT_NUM_GPUS_PER_NODE} \
    --nnodes=${SKYPILOT_NUM_NODES} \
    --node_rank=${SKYPILOT_NODE_RANK} \
    --master_addr=${MASTER_ADDR} \
    --master_port=${MASTER_PORT} \
    "${TRAIN_SCRIPT}"
